name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Check, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-validate-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "26"
          version: "0.2.1"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Prepare Playwright apt sources
        run: bash .github/scripts/prepare-playwright-apt.sh

      - name: Install browser test dependencies
        working-directory: packages/react
        run: vp exec playwright install --with-deps chromium firefox webkit

      - name: Ready gate
        run: vp run -w ready

      - name: Upload validated public package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: effect-view-server-dist
          path: packages/effect-view-server/dist
          if-no-files-found: error
          retention-days: 1

  smoke-benchmarks:
    name: Smoke Benchmark Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-smoke-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "26"
          version: "0.2.1"
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build packages
        run: vp run -r build

      - name: Prepare Playwright apt sources
        run: bash .github/scripts/prepare-playwright-apt.sh

      - name: Install Chromium benchmark dependencies
        working-directory: packages/react
        run: vp exec playwright install --with-deps chromium

      - name: Smoke benchmark regression gate
        run: vp run -w bench:baseline:smoke

      - name: Raw read/write benchmark regression gate
        run: vp run -w bench:baseline:raw-read-write

      - name: Active query sharing benchmark regression gate
        run: vp run -w bench:baseline:active-query-sharing

  publish:
    name: Publish npm package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - smoke-benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          submodules: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "26"
          version: "0.2.1"
          cache: false
          run-install: false

      - name: Download validated public package
        uses: actions/download-artifact@v8
        with:
          name: effect-view-server-dist
          path: packages/effect-view-server/dist

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.17.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify npm trusted publishing OIDC
        run: |
          npm --version
          node -e "if (!process.env.ACTIONS_ID_TOKEN_REQUEST_URL || !process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN) throw new Error('GitHub Actions OIDC token is unavailable. Check that the publish job has id-token: write.');"

      - name: Publish npm package
        run: node scripts/release-publish.mjs
    permissions:
      actions: read
      contents: write
      id-token: write
